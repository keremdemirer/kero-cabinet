name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: English source regression guard
        run: python3 scripts/check_english.py
      - name: Verify update manifest
        run: python3 scripts/update_manifest.py --check
      - name: Ruby syntax
        run: |
          ruby -c kero_cabinet.rb
          ruby -c kero_cabinet/core.rb
          ruby -c test/geometry_test.rb
          ruby -c kero_cabinet/updater.rb
          ruby -c test/updater_test.rb
      - name: Geometry and construction tests
        run: ruby test/construction_test.rb
      - name: Stacked section tests
        run: ruby test/stack_test.rb
      - name: Shallow drawer hardware tests
        run: ruby test/shallow_drawer_test.rb
      - name: Undermount geometry tests
        run: ruby test/undermount_test.rb
      - name: Drawer box height tests
        run: ruby test/drawer_height_test.rb
      - name: Worktop geometry
        run: ruby test/worktop_test.rb
      - name: Shared stock definitions
        run: ruby test/stock_test.rb
      - name: Live reload tests
        run: ruby test/reload_test.rb
      - name: Updater tests
        run: ruby test/updater_test.rb
      - name: Package SketchUp RBZ
        run: bash scripts/build.sh
      - name: Upload installation package
        uses: actions/upload-artifact@v4
        with:
          name: kero-cabinet-rbz
          path: dist/*.rbz
          if-no-files-found: error
